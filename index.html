<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KHALFABET</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#070e25;color:#fff;max-width:480px;margin:0 auto}.top{display:flex;justify-content:space-between;padding:12px;background:#101e3c;border-bottom:3px solid #ffcc00}.logo{font-weight:900;color:#ffcc00;font-size:22px}.bal{text-align:right}.bal b{color:#00e676;font-size:18px;display:block}.bal small{display:block;font-size:10px;color:#9fb0d0}.stage{height:360px;background:radial-gradient(ellipse at 50% 10%,#1e3c90 0%,#112151 35%,#070e25 75%);position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block}.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}#mult{font-size:68px;font-weight:900}#stat{margin-top:6px;background:#0f2048;padding:6px 18px;border-radius:20px;font-size:11px;font-weight:800}.hist{display:flex;gap:6px;padding:8px;background:#0a1630;overflow-x:auto}.hist span{padding:5px 10px;border-radius:20px;background:#16244a;font-weight:900;font-size:12px;flex-shrink:0}.panel{padding:12px;background:#0e1c3c}.box{background:#1c315c;border:1px solid #2a437a;border-radius:14px;padding:12px;margin-bottom:12px}.row{display:flex;gap:6px;margin-bottom:10px}.row input{flex:1;padding:13px;border-radius:11px;border:1px solid #2e4a80;background:#081129;color:#fff;font-weight:800}.q{background:#243a6a;color:#fff;min-width:56px;height:46px;border:none;border-radius:11px;font-weight:900}.bet{background:#ffcc00;color:#000;flex:1;border:none;padding:14px;border-radius:12px;font-weight:900}.cash{background:#00c853;color:#fff;flex:1;border:none;padding:14px;border-radius:12px;font-weight:900}.dep{width:100%;background:#ffcc00;color:#000;border:none;padding:14px;border-radius:12px;font-weight:900}.wit{width:100%;background:#1d335e;color:#fff;border:1px solid #3a5aa0;padding:13px;border-radius:12px;font-weight:800;margin-top:10px}#admin{background:#fff;color:#111;border-radius:14px;padding:12px;margin-top:12px;display:none}.modal{position:fixed;inset:0;background:rgba(3,8,25,.93);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}.mbox{background:#213760;border:2px solid #ffcc00;border-radius:20px;padding:20px;width:100%;max-width:370px}.mbox input{width:100%;padding:13px;border-radius:11px;border:1px solid #2e4a80;background:#0a1630;color:#fff;margin:6px 0}</style></head><body><div class="top"><div class="logo">KHALFABET</div><div class="bal"><small style="color:#ffcc00;font-weight:900">BALANCE</small><b id="bal">0 UGX</b><small id="uph">GUEST</small></div></div><div class="stage"><canvas id="c"></canvas><div class="center"><div id="mult">1.00x</div><div id="stat">WAITING</div></div></div><div class="hist" id="hist"></div><div class="panel"><div class="box"><div class="row"><input id="a1" value="1000" type="number"><button class="q" onclick="setA(1,500)">500</button><button class="q" onclick="setA(1,1000)">1K</button><button class="q" onclick="setA(1,5000)">5K</button></div><div class="row"><button id="b1" class="bet" onclick="handleBet(1)">BET 1000</button></div></div><div class="box"><div class="row"><input id="a2" value="2000" type="number"><button class="q" onclick="setA(2,2000)">2K</button><button class="q" onclick="setA(2,5000)">5K</button><button class="q" onclick="setA(2,10000)">10K</button></div><div class="row"><button id="b2" class="bet" style="background:#ff6a00;color:#fff" onclick="handleBet(2)">BET 2000</button></div></div><button class="dep" onclick="openM('depM')">+ DEPOSIT 0785344451</button><button class="wit" onclick="openM('withM')">- WITHDRAW 10% FEE</button><button class="wit" onclick="localStorage.removeItem('k_phone');location.reload()" style="background:#1a1a2e;border-color:#333;font-size:12px">LOGOUT</button><div id="admin"><h3 style="color:#c00;text-align:center">👑 ADMIN - 0785344451</h3><div id="alist"></div></div></div><div id="regM" class="modal" style="display:flex"><div class="mbox"><h3 style="color:#ffcc00;text-align:center">JOIN KHALFABET</h3><p style="text-align:center;color:#9fb0d0;font-size:11px">STARTS 0 UGX - NO BONUS</p><input id="rName" placeholder="Full Name"><input id="rPhone" placeholder="MTN 07XXXXXXXX"><input id="rPass" type="password" placeholder="Password"><button class="dep" onclick="doRegister()">CREATE ACCOUNT</button><p style="text-align:center;margin-top:10px;color:#aaa;font-size:13px">Have? <span onclick="doLogin()" style="color:#ffcc00;text-decoration:underline;font-weight:800">LOGIN</span></p></div></div><div id="depM" class="modal"><div class="mbox"><h3 style="color:#fff;text-align:center">DEPOSIT</h3><div style="background:#0a1630;padding:12px;border-radius:12px;margin:12px 0;font-size:13px;line-height:2">Dial *165*1*1#<br>To <b>0785344451</b><br>Names <b style="color:#ffcc00;background:#000;padding:2px 8px;border-radius:6px">DRICIRU SUBRA</b></div><input id="dAmt" type="number" placeholder="Amount"><input id="dTx" placeholder="TxID"><button class="dep" onclick="doDeposit()">I HAVE SENT</button><button class="wit" onclick="closeM('depM')">CANCEL</button></div></div><div id="withM" class="modal"><div class="mbox"><h3 style="color:#ffcc00;text-align:center">WITHDRAW</h3><p style="text-align:center;color:#9fb0d0;font-size:11px">10% FEE - VIA DRICIRU SUBRA</p><input id="wAmt" type="number" placeholder="Amount"><input id="wNum" placeholder="Your MTN"><button class="dep" style="background:#00c853;color:#fff" onclick="doWithdraw()">WITHDRAW</button><button class="wit" onclick="closeM('withM')">CANCEL</button></div></div><script>const cv=document.getElementById('c'),ctx=cv.getContext('2d');let bal=0,mult=1,flying=false,trail=[],bet1=null,bet2=null,hist=JSON.parse(localStorage.getItem('k_hist')||'[2.34,1.12,4.56,1.05,7.21]'),uph=localStorage.getItem('k_phone')||'';if(uph)bal=parseInt(localStorage.getItem('b_'+uph)||'0');const $=i=>document.getElementById(i);function rs(){cv.width=cv.offsetWidth*2;cv.height=cv.offsetHeight*2}window.addEventListener('resize',rs);rs();function ui(){$('bal').innerText=bal.toLocaleString()+' UGX';$('uph').innerText=uph?uph:'GUEST';if(uph)localStorage.setItem('b_'+uph,bal);let c=uph.replace(/\D/g,'').slice(-9);if(c==='785344451'||uph==='0785344451'){$('admin').style.display='block';loadAdmin()}else $('admin').style.display='none'}ui();function setA(n,v){$('a'+n).value=v}function handleBet(n){let b=$('b'+n);if(b.classList.contains('cash')){cashout(n);return}placeBet(n)}function placeBet(n){if(flying){alert('Plane flying!');return}let a=parseInt($('a'+n).value);if(a>bal){alert('Low bal! Deposit 0785344451 DRICIRU SUBRA');openM('depM');return}bal-=a;ui();let d={a:a,ok:true};if(n===1)bet1=d;else bet2=d;$('b'+n).className='cash';$('b'+n).innerText='CASHOUT @ 1.00x'}function cashout(n){if(!flying)return;let b=n===1?bet1:bet2;if(!b||!b.ok)return;let w=Math.floor(b.a*mult);bal+=w;ui();b.ok=false;$('b'+n).innerText='WON '+w;setTimeout(()=>resetBtn(n),1200)}function resetBtn(n){let b=$('b'+n);b.className='bet';b.innerText='BET '+$('a'+n).value;if(n===1)bet1=null;else bet2=null}function drawHist(){$('hist').innerHTML=hist.slice(0,20).map(v=>{let c=v<2?'#ff4d4d':v<5?'#ffcc00':'#00e676';return '<span style="color:'+c+'">'+v.toFixed(2)+'x</span>'}).join('')}drawHist();function drawP(){ctx.clearRect(0,0,cv.width,cv.height);if(trail.length<2)return;ctx.strokeStyle='#ffcc00';ctx.lineWidth=6;ctx.lineJoin='round';ctx.shadowColor='#ffcc00';ctx.shadowBlur=6;ctx.beginPath();trail.forEach((m,i)=>{let x=(i/trail.length)*cv.width*0.78+20;let y=cv.height-(Math.log(m)/Math.log(32))*cv.height*0.62-45;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});ctx.stroke();ctx.shadowBlur=0;let last=trail[trail.length-1];let x=cv.width*0.78+16;let y=cv.height-(Math.log(last)/Math.log(32))*cv.height*0.62-58;ctx.font='40px Arial';ctx.fillText('✈️',x,y)}function start(){let s=Date.now();mult=1;flying=true;trail=[];$('mult').style.color='#fff';$('stat').innerText='FLYING...';let r=Math.random();let crash=r<0.07?1+Math.random()*0.85:r<0.93?1.15+Math.random()*8.2:10+Math.random()*90;let iv=setInterval(()=>{let e=(Date.now()-s)/1000;mult=+(1+e*0.71).toFixed(2);if(mult>crash)mult=crash;$('mult').innerText=mult.toFixed(2)+'x';if(bet1&&bet1.ok)$('b1').innerText='CASHOUT @ '+mult.toFixed(2)+'x = '+Math.floor(bet1.a*mult);if(bet2&&bet2.ok)$('b2').innerText='CASHOUT @ '+mult.toFixed(2)+'x = '+Math.floor(bet2.a*mult);trail.push(mult);if(trail.length>85)trail.shift();drawP();if(mult>=crash){clearInterval(iv);flying=false;hist.unshift(crash);if(hist.length>70)hist.pop();localStorage.setItem('k_hist',JSON.stringify(hist));drawHist();$('mult').innerText=crash.toFixed(2)+'x CRASHED';$('mult').style.color='#ff3d3d';$('stat').innerText='CRASHED @ '+crash.toFixed(2)+'x';if(bet1&&bet1.ok){bet1=null;resetBtn(1)}if(bet2&&bet2.ok){bet2=null;resetBtn(2)}setTimeout(start,3000)}},40)}start();function openM(i){$(i).style.display='flex'}function closeM(i){$(i).style.display='none'}function doRegister(){let n=$('rName').value.trim(),p=$('rPhone').value.trim(),pw=$('rPass').value.trim();if(n.length<2||p.length<9||pw.length<4){alert('Fill all');return}uph=p;localStorage.setItem('k_phone',uph);localStorage.setItem('k_name_'+uph,n);if(!localStorage.getItem('b_'+uph))localStorage.setItem('b_'+uph,'0');bal=parseInt(localStorage.getItem('b_'+uph)||'0');ui();$('regM').style.display='none';alert('Welcome '+n+'! Balance 0 UGX - Deposit 0785344451 DRICIRU SUBRA')}function doLogin(){let p=prompt('Enter MTN:');if(!p)return;uph=p.trim();if(!localStorage.getItem('b_'+uph)){alert('Not found');return}localStorage.setItem('k_phone',uph);bal=parseInt(localStorage.getItem('b_'+uph)||'0');ui();$('regM').style.display='none'}if(uph)$('regM').style.display='none';else $('regM').style.display='flex';function doDeposit(){let a=parseInt($('dAmt').value),t=$('dTx').value.trim();if(isNaN(a)||a<1000||t.length<4){alert('Enter amount & TxID');return}let l=JSON.parse(localStorage.getItem('k_pending')||'[]');l.unshift({type:'DEPOSIT',phone:uph,amount:a,tx:t,time:new Date().toLocaleString()});localStorage.setItem('k_pending',JSON.stringify(l));bal+=a;ui();closeM('depM');loadAdmin();alert('Deposit '+a+' added! DRICIRU SUBRA - Bal: '+bal)}function doWithdraw(){let a=parseInt($('wAmt').value),n=$('wNum').value.trim();if(isNaN(a)||a<2000||n.length<9){alert('Fill');return}if(a>bal){alert('Low bal');return}let f=Math.floor(a*0.1),g=a-f;bal-=a;ui();let l=JSON.parse(localStorage.getItem('k_pending')||'[]');l.unshift({type:'WITHDRAW',phone:n,amount:a,fee:f,get:g,from:uph,time:new Date().toLocaleString()});localStorage.setItem('k_pending',JSON.stringify(l));closeM('withM');loadAdmin();alert('Withdraw '+a+' Fee '+f+' You get '+g+' via DRICIRU SUBRA')}function loadAdmin(){let l=JSON.parse(localStorage.getItem('k_pending')||'[]');if(!l.length){$('alist').innerHTML='No tx';return}$('alist').innerHTML=l.map((x,i)=>{if(x.type==='DEPOSIT')return '<div style="border-bottom:1px solid #eee;padding:8px 0;font-size:12px"><b>DEPOSIT</b> '+x.amount+' From '+x.phone+' Tx '+x.tx+'<br><small>'+x.time+'</small><br><button onclick="approveTx('+i+')" style="background:#00c853;color:#fff;padding:5px 10px;border:none;border-radius:6px">DONE</button></div>';else return '<div style="border-bottom:1px solid #eee;padding:8px 0;font-size:12px"><b>WITHDRAW</b> '+x.amount+' -> SEND '+x.get+' To '+x.phone+'<br><small>'+x.time+'</small><br><button onclick="approveTx('+i+')" style="background:#ff6a00;color:#fff;padding:5px 10px;border:none;border-radius:6px">SENT</button></div>'}).join('')}function approveTx(i){let l=JSON.parse(localStorage.getItem('k_pending')||'[]');l.splice(i,1);localStorage.setItem('k_pending',JSON.stringify(l));loadAdmin()}</script></body></html>
