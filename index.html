<!DOCTYPE html>
<html>
<head>
<title>KHALFABET V8 FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0a0a;color:white;font-family:Arial;padding:10px}
.card{background:#1a1a1a;padding:15px;border-radius:10px;margin:10px 0}
input,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:none}
button{background:#00ff88;color:black;font-weight:bold;cursor:pointer}
.admin-only{display:none}
</style>
</head>
<body>
<h1 style="color:#00ff88">KHALFABET V8 🔥</h1>

<div id="auth" class="card">
<h3>Login / Register</h3>
<input id="phone" placeholder="Phone e.g 0785...">
<input id="pass" type="password" placeholder="Password">
<button onclick="register()">REGISTER</button>
<button onclick="login()">LOGIN</button>
<p>Balance: <span id="bal">0</span> UGX</p>
</div>

<div class="card">
<h3>Deposit MoMo: 0785344451</h3>
<input id="amount" placeholder="Amount">
<input id="txid" placeholder="TxID from MTN">
<button onclick="deposit()">Submit Deposit</button>
</div>

<div id="adminLogin" class="card">
<h3>Admin Login</h3>
<input id="adminPass" type="password" placeholder="Admin Password">
<button onclick="adminLogin()">Enter Admin</button>
</div>

<div id="adminPanel" class="card admin-only">
<h3>Admin Panel - Deposits</h3>
<div id="deposits"></div>
</div>

<script>
// DATABASE using localStorage (upgrade to Supabase later)
let users = JSON.parse(localStorage.getItem('khalfa_users')||'{}');
let deposits = JSON.parse(localStorage.getItem('khalfa_deps')||'[]');
let currentUser = null;

function register(){
 let p=phone.value, pw=pass.value;
 if(!p||!pw){alert('Enter phone & password');return}
 if(users[p]){alert('Already exists, login');return}
 users[p]={password:pw,balance:0};
 localStorage.setItem('khalfa_users',JSON.stringify(users));
 alert('Registered! Now Login');
}

function login(){
 let p=phone.value, pw=pass.value;
 if(users[p] && users[p].password===pw){
  currentUser=p;
  bal.innerText=users[p].balance;
  alert('Welcome '+p);
 } else alert('Wrong phone/password');
}

function deposit(){
 let amt=amount.value, tx=txid.value;
 if(!currentUser){alert('Login first');return}
 deposits.push({phone:currentUser,amount:amt,txid:tx,status:'pending'});
 localStorage.setItem('khalfa_deps',JSON.stringify(deposits));
 alert('Deposit sent! Wait admin approval');
 renderDeps();
}

function adminLogin(){
 if(adminPass.value==='KhalfaAdmin@0785'){
  document.getElementById('adminPanel').style.display='block';
  alert('Admin OK');
  renderDeps();
 } else alert('Wrong admin password');
}

function renderDeps(){
 let html='';
 deposits.forEach((d,i)=>{
  html+=`<div style="border:1px solid #333;padding:8px;margin:5px">Phone:${d.phone} Amt:${d.amount} Tx:${d.txid} <button onclick="approve(${i})">APPROVE</button></div>`;
 });
 depositsDiv=document.getElementById('deposits');
 if(depositsDiv) depositsDiv.innerHTML=html;
}

function approve(i){
 let d=deposits[i];
 if(users[d.phone]){
  users[d.phone].balance+=parseInt(d.amount);
  localStorage.setItem('khalfa_users',JSON.stringify(users));
  deposits[i].status='approved';
  localStorage.setItem('khalfa_deps',JSON.stringify(deposits));
  alert('Approved '+d.amount+' to '+d.phone);
  renderDeps();
 }
}
renderDeps();
</script>
</body>
  </html>
