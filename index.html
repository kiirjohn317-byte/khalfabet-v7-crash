<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KHALFABET V8</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0b0e1f;color:#fff;font-family:Arial}.h{background:#151a33;padding:15px;display:flex;justify-content:space-between;border-bottom:2px solid #ff2040;position:relative;z-index:10}.logo{font-weight:900;color:#ff2040;font-size:17px;cursor:pointer;padding:10px;background:#000;border-radius:5px;border:2px solid #ff2040}.bal{color:#00ff88;font-weight:900;background:#1f2547;padding:7px 12px;border-radius:20px}.game{position:relative;width:100%;height:380px;background:radial-gradient(#1e2a5a,#0b0e1f);overflow:hidden}canvas{width:100%;height:100%}.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}.mult{font-size:70px;font-weight:900}.top{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;font-size:11px;pointer-events:none}.pill{background:rgba(0,0,0,.6);padding:5px 9px;border-radius:10px}.ctrl{padding:10px;background:#12162f;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.box{background:#1b2040;padding:12px;border-radius:10px;width:100%;max-width:360px;border:1px solid #2a3160}.box h4{color:#ffcc00;text-align:center;margin-bottom:6px;font-size:14px}.box input,.box select{width:100%;padding:10px;border-radius:6px;border:none;background:#0b0e1f;color:#fff;margin:4px 0;text-align:center}.btn{width:100%;padding:11px;border-radius:6px;border:none;font-weight:900;cursor:pointer;margin-top:5px}.bet{background:#00e676}.cash{background:#ffcc00}.dep{background:#2196F3;color:#fff}.wit{background:#ff5722;color:#fff}.copyBox{display:flex;gap:5px;background:#0b0e1f;padding:7px;border-radius:6px;margin:5px 0}.copyBox span{flex:1;color:#00ff88;font-weight:900}#adm{position:fixed;top:0;left:0;width:100%;height:100%;background:#0b0e1f;z-index:999;display:none;overflow:auto;padding:12px}.card{background:#1b2040;padding:10px;border-radius:8px;margin:8px 0;border-left:4px solid #00ff88;font-size:13px}</style></head><body>
<div class="h"><div class="logo" id="logoBtn" onclick="clkL()">🔴 KHALFABET V8 - TAP 5X ADMIN</div><div class="bal"><span id="bal">0</span> UGX</div></div>
<div class="game"><canvas id="c"></canvas><div class="top"><div class="pill">🟢 <span id="on">400</span></div><div class="pill">R <span id="rnd">1</span></div></div><div class="center"><div class="mult" id="m">1.00x</div><div id="s" style="font-weight:900">AUTO...</div></div></div>
<div class="ctrl">
<div class="box"><h4>🎮 BET Max 20k Win 500k</h4><input type="number" id="betIn" value="1000" min="100" max="20000"><button class="btn bet" id="betBtn" onclick="placeBet()">BET NEXT</button><button class="btn cash" id="cashBtn" onclick="doCash()" style="display:none">CASHOUT</button></div>
<div class="box"><h4>💳 DEPOSIT Min 500</h4><div class="copyBox"><span>0785344451</span><button onclick="navigator.clipboard.writeText('0785344451');alert('Copied!')" style="background:#ffcc00;border:none;padding:6px 10px;border-radius:5px;font-weight:900">COPY</button></div><input id="depName" placeholder="Full Name"><input id="depPhone" placeholder="Your Number"><select id="depNet"><option value="">Network</option><option>MTN</option><option>Airtel</option></select><input type="number" id="depAmt" placeholder="Amount min 500"><input id="depTx" placeholder="TxID"><button class="btn dep" onclick="reqDep()">SUBMIT</button><div id="depStat" style="font-size:11px;color:#0f0"></div></div>
<div class="box"><h4>💸 WITHDRAW Min 3000</h4><input type="number" id="witAmt" placeholder="Amount min 3000"><input id="witPhone" placeholder="Number to receive"><input id="witName" placeholder="MoMo Name"><button class="btn wit" onclick="reqWit()">SUBMIT</button><div id="witStat" style="font-size:11px;color:#fa0"></div></div>
</div>
<div id="adm"><h2>🔒 ADMIN PANEL</h2><div id="logDiv"><input type="password" id="pw" placeholder="Password" style="padding:12px;width:80%"><button onclick="login()" class="btn dep" style="width:auto">LOGIN</button><div id="blk" style="color:red;margin-top:10px"></div><p style="margin-top:20px">Password: Khalfa@2026!Ug$ecure786</p></div><div id="pan" style="display:none"><p>Main Bal: <b id="curBal">0</b> UGX</p><h3>Deposits</h3><div id="deps"></div><h3>Withdraws</h3><div id="wits"></div><button onclick="loadA()" class="btn dep" style="width:auto">Refresh</button> <button onclick="document.getElementById('adm').style.display='none'" class="btn wit" style="width:auto">Close Game</button> <button onclick="if(confirm('Clear?')){localStorage.clear();loadA()}" style="background:red;color:#fff;padding:8px;border:none;border-radius:5px">Clear All</button></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W,H;function rs(){W=cv.width=cv.offsetWidth*2;H=cv.height=cv.offsetHeight*2}rs();addEventListener('resize',rs);
let mult=1,state='wait',crash=2,px=80,py=H-60,trail=[],t0=0,bal=parseInt(localStorage.getItem('kb_bal')||'0'),hasBet=false,betAmt=0,rnd=1,lc=0;
if(isNaN(bal)||bal>1000000){bal=0;localStorage.setItem('kb_bal','0')}
document.getElementById('bal').textContent=bal;
function getCrash(){let r=Math.random();if(r<0.5)return 1.1+Math.random()*0.8;if(r<0.8)return 2+Math.random()*2;if(r<0.92)return 4+Math.random()*3;return 7+Math.random()*8}
function placeBet(){let a=parseInt(document.getElementById('betIn').value);if(a<100||a>20000){alert('100-20000');return}if(bal<=0){alert('Deposit first!');return}if(a>bal){alert('Low bal');return}if(hasBet)return;betAmt=a;hasBet=true;bal-=a;if(bal<0)bal=0;localStorage.setItem('kb_bal',bal);document.getElementById('bal').textContent=bal;document.getElementById('betBtn').style.display='none';document.getElementById('cashBtn').style.display='block';document.getElementById('s').textContent='BET '+a}
function doCash(){if(!hasBet||state!='fly')return;let win=Math.floor(betAmt*mult);if(win>500000)win=500000;bal+=win;localStorage.setItem('kb_bal',bal);document.getElementById('bal').textContent=bal;document.getElementById('s').textContent='WIN '+win;hasBet=false;document.getElementById('betBtn').style.display='block';document.getElementById('cashBtn').style.display='none';}
function reqDep(){let n=depName.value.trim(),p=depPhone.value.trim(),net=depNet.value,a=depAmt.value.trim(),tx=depTx.value.trim().toUpperCase();if(!n||!p||!net||!a||!tx){alert('Fill all!');return}if(parseInt(a)<500){alert('Min 500');return}let L=JSON.parse(localStorage.getItem('kb_deps')||'[]');if(L.some(x=>x.tx===tx)){alert('Duplicate TxID!');return}L.push({id:Date.now(),name:n,phone:p,network:net,amt:parseInt(a),tx:tx,status:'pending',time:new Date().toLocaleString()});localStorage.setItem('kb_deps',JSON.stringify(L));depStat.innerHTML='Pending admin';depName.value=depPhone.value=depAmt.value=depTx.value='';}
function reqWit(){let a=witAmt.value.trim(),ph=witPhone.value.trim(),nm=witName.value.trim();if(!a||!ph||!nm){alert('Fill all!');return}if(parseInt(a)<3000){alert('Min 3000');return}if(parseInt(a)>bal){alert('Low bal');return}let L=JSON.parse(localStorage.getItem('kb_wits')||'[]');L.push({id:Date.now(),name:nm,phone:ph,amt:parseInt(a),status:'pending',time:new Date().toLocaleString()});localStorage.setItem('kb_wits',JSON.stringify(L));bal-=parseInt(a);if(bal<0)bal=0;localStorage.setItem('kb_bal',bal);document.getElementById('bal').textContent=bal;witStat.innerHTML='Pending admin';witAmt.value=witPhone.value=witName.value='';}
function drawP(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(-0.18);ctx.fillStyle='#ff2a2a';ctx.beginPath();ctx.moveTo(-35,-7);ctx.lineTo(35,0);ctx.lineTo(-35,7);ctx.lineTo(-26,0);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(17,0,5,0,6.28);ctx.fill();ctx.restore();}
function draw(){ctx.clearRect(0,0,W,H);if(trail.length>1){ctx.strokeStyle='#ff2040';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);for(let i=1;i<trail.length;i++)ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();}if(state!='wait')drawP(px,py);else drawP(80,H-60);}
function loop(){if(state==='fly'){let e=(Date.now()-t0)/1000;mult=Math.pow(1.08,e);if(mult>=crash){state='crash';m.textContent=crash.toFixed(2)+'x';m.style.color='#ff2040';s.textContent='CRASH '+crash.toFixed(2)+'x';if(hasBet){hasBet=false;betBtn.style.display='block';cashBtn.style.display='none';}setTimeout(()=>{rnd++;document.getElementById('rnd').textContent=rnd;state='wait';m.textContent='1.00x';m.style.color='#fff';s.textContent='Next 3s...';trail=[];setTimeout(()=>{state='fly';crash=getCrash();t0=Date.now();trail=[{x:80,y:H-60}];mult=1;px=80;py=H-60;},3000)},1200);}else{m.textContent=mult.toFixed(2)+'x';m.style.color=mult<2?'#fff':mult<5?'#0f8':'#fc0';s.textContent='FLY '+mult.toFixed(2)+'x';let pr=Math.min(e/11,1);px=80+pr*(W-150);py=(H-60)-pr*(H-130);trail.push({x:px-18,y:py});if(trail.length>90)trail.shift();if(hasBet){let w=Math.floor(betAmt*mult);if(w>500000)w=500000;cashBtn.innerHTML='CASH '+w+'<br>'+mult.toFixed(2)+'x';}}}draw();requestAnimationFrame(loop);}loop();setTimeout(()=>{state='fly';crash=getCrash();t0=Date.now();trail=[{x:80,y:H-60}];},2000);setInterval(()=>{on.textContent=Math.floor(350+Math.random()*80)},3000);
const PASS='Khalfa@2026!Ug$ecure786';let fails=parseInt(localStorage.getItem('adm_fail')||'0'),block=parseInt(localStorage.getItem('adm_block')||'0'),lt;
function clkL(){lc++;console.log('tap',lc);if(lc>=5){lc=0;openAdm();}setTimeout(()=>{if(lc>0&&lc<5)lc=0},3000);}
function openAdm(){document.getElementById('adm').style.display='block';}
function login(){if(Date.now()<block){let m=Math.ceil((block-Date.now())/60000);blk.textContent='Blocked '+m+' mins';return}if(pw.value===PASS){localStorage.setItem('adm_fail','0');logDiv.style.display='none';pan.style.display='block';clearTimeout(lt);lt=setTimeout(()=>{adm.style.display='none';logDiv.style.display='block';pan.style.display='none';pw.value='';},600000);loadA();}else{fails++;localStorage.setItem('adm_fail',fails);if(fails>=3){block=Date.now()+1800000;localStorage.setItem('adm_block',block);blk.textContent='Block 30 mins';}else blk.textContent='Wrong '+fails+'/3';}}
function loadA(){let d=JSON.parse(localStorage.getItem('kb_deps')||'[]'),w=JSON.parse(localStorage.getItem('kb_wits')||'[]');curBal.textContent=localStorage.getItem('kb_bal')||'0';deps.innerHTML=d.slice().reverse().map(x=>`<div class=card>${x.time}<br><b>${x.name}</b> ${x.phone} ${x.network}<br>${x.amt} UGX Tx:${x.tx} ${x.status}<br>${x.status=='pending'?`<button onclick="apD(${x.id})" style="background:#0f6;color:#000;padding:6px;border:none;border-radius:5px;font-weight:900">APPROVE</button> <button onclick="rjD(${x.id})" style="background:red;color:#fff;padding:6px;border:none;border-radius:5px">REJECT</button>`:x.status}</div>`).join('')||'No dep';wits.innerHTML=w.slice().reverse().map(x=>`<div class=card>${x.time}<br><b>${x.name}</b> ${x.phone} ${x.amt} UGX ${x.status}<br>${x.status=='pending'?`<button onclick="apW(${x.id})" style="background:#fa0;padding:6px;border:none;border-radius:5px;font-weight:900">APPROVE SEND</button> <button onclick="rjW(${x.id})" style="background:red;color:#fff;padding:6px;border:none">REJECT REFUND</button>`:x.status}</div>`).join('')||'No wit';}
function apD(id){let L=JSON.parse(localStorage.getItem('kb_deps')||'[]'),i=L.find(x=>x.id===id);if(i){i.status='approved';let b=parseInt(localStorage.getItem('kb_bal')||'0');b+=i.amt;localStorage.setItem('kb_bal',b);document.getElementById('bal').textContent=b;localStorage.setItem('kb_deps',JSON.stringify(L));loadA();}}
function rjD(id){let L=JSON.parse(localStorage.getItem('kb_deps')||'[]');L.find(x=>x.id===id).status='rejected';localStorage.setItem('kb_deps',JSON.stringify(L));loadA();}
function apW(id){let L=JSON.parse(localStorage.getItem('kb_wits')||'[]');L.find(x=>x.id===id).status='approved';localStorage.setItem('kb_wits',JSON.stringify(L));loadA();alert('Send MoMo now!');}
function rjW(id){let L=JSON.parse(localStorage.getItem('kb_wits')||'[]'),i=L.find(x=>x.id===id);i.status='rejected';let b=parseInt(localStorage.getItem('kb_bal')||'0');b+=i.amt;localStorage.setItem('kb_bal',b);document.getElementById('bal').textContent=b;localStorage.setItem('kb_wits',JSON.stringify(L));loadA();}
if(location.search.includes('admin')){openAdm();}
</script></body></html>
