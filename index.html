<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KHALFABET V8 REAL - WORKING</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0e1f;color:#fff;font-family:Arial}
.h{background:#151a33;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #ff2040}
.logo{font-weight:900;color:#ff2040;font-size:20px}.logo span{color:#fff}
.bal{color:#00ff88;font-weight:900;background:#1f2547;padding:8px 14px;border-radius:20px}
.game{position:relative;width:100%;height:420px;background:radial-gradient(ellipse at bottom,#1e2a5a 0%,#0b0e1f 70%);overflow:hidden}
canvas{width:100%;height:100%;display:block}
.center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:5}
.mult{font-size:72px;font-weight:900}
.stat{font-weight:bold;margin-top:6px}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;font-size:12px;z-index:6}
.pill{background:rgba(0,0,0,.6);padding:6px 10px;border-radius:12px}
.ctrl{padding:16px;background:#12162f;display:flex;justify-content:center}
.box{background:#1b2040;padding:15px;border-radius:12px;width:100%;max-width:380px;border:1px solid #2a3160}
.box input{width:100%;padding:12px;border-radius:8px;border:none;background:#0b0e1f;color:#fff;text-align:center;font-size:18px;margin:10px 0}
.btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:900;font-size:18px;cursor:pointer;margin-top:6px}
.bet{background:#00e676;color:#000}
.cash{background:#ffcc00;color:#000}
.btn:active{transform:scale(0.97)}
</style>
</head>
<body>
<div class="h"><div class="logo">KHALFABET <span>V8</span></div><div class="bal"><span id="bal">5000</span> UGX</div></div>
<div class="game"><canvas id="c"></canvas>
<div class="top"><div class="pill">🟢 <span id="on">342</span> online</div><div class="pill">Round <span id="rnd">1</span></div></div>
<div class="center"><div class="mult" id="m">1.00x</div><div class="stat" id="s">WAITING...</div></div>
</div>
<div class="ctrl"><div class="box">
<label style="font-size:12px;color:#8899bb">BET AMOUNT UGX</label>
<input type="number" id="betIn" value="1000">
<button class="btn bet" id="betBtn" onclick="placeBet()">BET - JOIN NEXT FLIGHT</button>
<button class="btn cash" id="cashBtn" onclick="doCash()" style="display:none">CASHOUT</button>
<p style="text-align:center;font-size:11px;color:#8899bb;margin-top:8px">✈️ Auto-fly every 8 sec - No registration</p>
</div></div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=canvas.offsetWidth*2;H=canvas.height=canvas.offsetHeight*2}resize();window.addEventListener('resize',resize);
let mult=1,state='wait',crash=2,px=80,py=H-60,trail=[],t0=0,bal=5000,hasBet=false,betAmt=0,rnd=1;
const mEl=document.getElementById('m'),sEl=document.getElementById('s'),balEl=document.getElementById('bal'),betIn=document.getElementById('betIn'),betBtn=document.getElementById('betBtn'),cashBtn=document.getElementById('cashBtn');

function getCrash(){let r=Math.random();if(r<0.5)return 1.1+Math.random()*0.9;if(r<0.8)return 2+Math.random()*2;if(r<0.93)return 4+Math.random()*4;return 8+Math.random()*12}

function placeBet(){
 let a=parseInt(betIn.value);
 if(isNaN(a)||a<100){alert('Min 100 UGX');return}
 if(a>bal){alert('Low balance!');return}
 if(hasBet){alert('Already bet placed!');return}
 betAmt=a;hasBet=true;bal-=a;balEl.textContent=bal;
 betBtn.style.display='none';cashBtn.style.display='block';
 cashBtn.innerHTML='CASHOUT '+a+' UGX<br><small>1.00x</small>';
 sEl.textContent='✅ BET PLACED '+a+' UGX - NEXT FLIGHT!';
 sEl.style.color='#00ff88';
 console.log('Bet placed',a);
}
function doCash(){
 if(!hasBet||state!=='fly')return;
 let win=Math.floor(betAmt*mult);
 bal+=win;balEl.textContent=bal;
 sEl.textContent='💰 WIN '+win+' UGX at '+mult.toFixed(2)+'x!';
 sEl.style.color='#ffcc00';
 hasBet=false;betBtn.style.display='block';cashBtn.style.display='none';
}

function drawPlane(x,y,s){
 ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.rotate(-0.18);
 ctx.fillStyle='#ff2a2a';ctx.beginPath();ctx.moveTo(-36,-7);ctx.lineTo(36,0);ctx.lineTo(-36,7);ctx.lineTo(-26,0);ctx.closePath();ctx.fill();
 ctx.fillStyle='#7ec8ff';ctx.beginPath();ctx.arc(16,-1,5,0,6.28);ctx.fill();
 ctx.strokeStyle='rgba(200,200,200,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(38,0,2,12,0,0,6.28);ctx.stroke();
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.strokeStyle='rgba(255,255,255,.04)';
 for(let i=0;i<W;i+=70){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke()}
 if(trail.length>1){ctx.strokeStyle='#ff2040';ctx.lineWidth=4;ctx.shadowColor='#ff2040';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(trail[0].x,trail[0].y);trail.forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke();ctx.shadowBlur=0}
 if(state!=='wait'){drawPlane(px,py,1.1+mult*0.02);if(state==='crash'){ctx.fillStyle='#fff';ctx.font='bold 20px Arial';ctx.fillText('💥 BOOM '+crash.toFixed(2)+'x',px-40,py-30)}}else{drawPlane(80,H-50,0.9)}
}
function loop(){
 if(state==='fly'){
  let e=(Date.now()-t0)/1000;mult=Math.pow(1.08,e);
  if(mult>=crash){
   state='crash';mEl.textContent=crash.toFixed(2)+'x';mEl.style.color='#ff2040';
   sEl.textContent='💥 CRASHED '+crash.toFixed(2)+'x';sEl.style.color='#ff2040';
   if(hasBet){hasBet=false;betBtn.style.display='block';cashBtn.style.display='none';sEl.textContent+=' - YOU LOST '+betAmt}
   setTimeout(()=>{rnd++;document.getElementById('rnd').textContent=rnd;state='wait';mEl.textContent='1.00x';mEl.style.color='#fff';sEl.textContent='WAITING FOR NEXT ROUND...';sEl.style.color='#ffaa00';trail=[];setTimeout(()=>{state='fly';crash=getCrash();t0=Date.now();trail=[{x:80,y:H-50}]},3000)},2000);
  }else{
   mEl.textContent=mult.toFixed(2)+'x';mEl.style.color=mult<2?'#fff':mult<5?'#00ff88':'#ffcc00';
   sEl.textContent='✈️ FLYING '+mult.toFixed(2)+'x';sEl.style.color='#00ff88';
   let pr=Math.min(e/10,1);px=80+pr*(W-160);py=(H-50)-pr*(H-120)+Math.sin(e*3)*4;
   trail.push({x:px-18,y:py});if(trail.length>80)trail.shift();
   if(hasBet){let w=Math.floor(betAmt*mult);cashBtn.innerHTML='CASHOUT '+w+' UGX<br><small>'+mult.toFixed(2)+'x</small>'}
  }
 }
 draw();requestAnimationFrame(loop);
}
loop();
setTimeout(()=>{state='fly';crash=getCrash();t0=Date.now();trail=[{x:80,y:H-50}]},2000);
setInterval(()=>{document.getElementById('on').textContent=300+Math.floor(Math.random()*90)},2000);
</script>
</body>
                                                          </html>
